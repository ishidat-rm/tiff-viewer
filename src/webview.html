<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' vscode-resource: https:; style-src 'unsafe-inline';">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e1e;
      color: #ccc;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #controls {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 6px 10px;
      flex-wrap: wrap;
      background: #2d2d2d;
      flex-shrink: 0;
    }
    label { font-size: 12px; }
    button {
      background: #444;
      color: #ccc;
      border: none;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 3px;
    }
    button:hover { background: #555; }
    select {
      background: #444;
      color: #ccc;
      border: none;
      padding: 2px 4px;
      font-size: 12px;
    }
    #stats { font-size: 11px; color: #888; }
    #zoomLabel { font-size: 12px; min-width: 80px; }
    #canvasContainer {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    #info {
      font-size: 12px;
      padding: 3px 10px;
      color: #aaa;
      background: #2d2d2d;
      flex-shrink: 0;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label>Min: <input type="range" id="minSlider" min="0" max="100" value="0"></label>
    <label>Max: <input type="range" id="maxSlider" min="0" max="100" value="100"></label>
    <label>Gamma: <input type="range" id="gammaSlider" min="10" max="300" value="100"></label>
    <label>Ch: <select id="channelSelect"></select></label>
    <button id="zoomOut">－</button>
    <span id="zoomLabel">Zoom: 100%</span>
    <button id="zoomIn">＋</button>
    <button id="zoomReset">Reset</button>
    <span id="stats"></span>
    <div id="pageControls" style="display:none; gap:6px; align-items:center;">
      <button id="prevPage">◀</button>
      <span id="pageLabel">Page: 1 / 1</span>
      <button id="nextPage">▶</button>
    </div>
  </div>
  <div id="canvasContainer">
    <canvas id="canvas"></canvas>
  </div>
  <div id="info">---</div>

  <script src="__GEOTIFF_URI__"></script>
<script>
(async () => {
  const base64 = '__TIFF_BASE64__';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  const tiff = await GeoTIFF.fromArrayBuffer(bytes.buffer);
  const pageCount = await tiff.getImageCount();
  let currentPage = 0;

  let width, height, rasters, numChannels;

  async function loadPage(idx) {
    const image = await tiff.getImage(idx);
    width = image.getWidth();
    height = image.getHeight();
    rasters = await image.readRasters();
    numChannels = rasters.length;

    canvas.width = width;
    canvas.height = height;
    imageData = ctx.createImageData(width, height);

    // チャンネル選択UI再構築
    channelSelect.innerHTML = '';
    const optAll = document.createElement('option');
    optAll.value = 'rgb';
    optAll.textContent = numChannels >= 3 ? 'RGB' : 'Gray';
    channelSelect.appendChild(optAll);
    for (let i = 0; i < numChannels; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Ch ${i + 1}`;
      channelSelect.appendChild(opt);
    }

    const stats0 = getStats(rasters[0]);
    document.getElementById('stats').textContent =
      `${rasters[0].constructor.name}  ${stats0.min.toFixed(1)}–${stats0.max.toFixed(1)}  ${width}×${height}  ${numChannels}ch`;

    document.getElementById('pageLabel').textContent = `Page: ${currentPage + 1} / ${pageCount}`;

    render();
  }

  function getStats(ch) {
    let min = Infinity, max = -Infinity;
    for (let i = 0; i < ch.length; i++) {
      if (ch[i] < min) min = ch[i];
      if (ch[i] > max) max = ch[i];
    }
    return { min, max };
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const channelSelect = document.getElementById('channelSelect');
  let imageData;

  function render() {
    const minP = parseFloat(document.getElementById('minSlider').value) / 100;
    const maxP = parseFloat(document.getElementById('maxSlider').value) / 100;
    const gamma = parseFloat(document.getElementById('gammaSlider').value) / 100;
    const chVal = channelSelect.value;

    if (chVal === 'rgb' && numChannels >= 3) {
      const s = [getStats(rasters[0]), getStats(rasters[1]), getStats(rasters[2])];
      for (let i = 0; i < width * height; i++) {
        for (let c = 0; c < 3; c++) {
          const lo = s[c].min + (s[c].max - s[c].min) * minP;
          const hi = s[c].min + (s[c].max - s[c].min) * maxP;
          let v = (rasters[c][i] - lo) / (hi - lo || 1);
          v = Math.max(0, Math.min(1, v));
          v = Math.pow(v, 1 / gamma);
          imageData.data[i * 4 + c] = Math.round(v * 255);
        }
        imageData.data[i * 4 + 3] = 255;
      }
    } else {
      const ch = rasters[chVal === 'rgb' ? 0 : parseInt(chVal)];
      const s = getStats(ch);
      const lo = s.min + (s.max - s.min) * minP;
      const hi = s.min + (s.max - s.min) * maxP;
      const range = hi - lo || 1;
      for (let i = 0; i < ch.length; i++) {
        let v = (ch[i] - lo) / range;
        v = Math.max(0, Math.min(1, v));
        v = Math.pow(v, 1 / gamma);
        const byte = Math.round(v * 255);
        imageData.data[i * 4 + 0] = byte;
        imageData.data[i * 4 + 1] = byte;
        imageData.data[i * 4 + 2] = byte;
        imageData.data[i * 4 + 3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  document.getElementById('minSlider').addEventListener('input', render);
  document.getElementById('maxSlider').addEventListener('input', render);
  document.getElementById('gammaSlider').addEventListener('input', render);
  channelSelect.addEventListener('change', render);

  // ページ送り
  document.getElementById('prevPage').addEventListener('click', async () => {
    if (currentPage > 0) {
      currentPage--;
      await loadPage(currentPage);
    }
  });
  document.getElementById('nextPage').addEventListener('click', async () => {
    if (currentPage < pageCount - 1) {
      currentPage++;
      await loadPage(currentPage);
    }
  });

  // ページUIはマルチページのときだけ表示
  if (pageCount > 1) {
    document.getElementById('pageControls').style.display = 'flex';
  }

  // ズーム
  let scale = 1.0, offsetX = 0, offsetY = 0;
  let isDragging = false, dragStartX, dragStartY, dragStartOX, dragStartOY;
  const container = document.getElementById('canvasContainer');

  function applyTransform() {
    canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    document.getElementById('zoomLabel').textContent = `Zoom: ${Math.round(scale * 100)}%`;
  }

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left - offsetX;
    const my = e.clientY - rect.top - offsetY;
    const delta = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    const newScale = Math.max(0.1, Math.min(50, scale * delta));
    offsetX -= mx * (newScale - scale);
    offsetY -= my * (newScale - scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });

  container.addEventListener('mousedown', e => {
    if (e.button === 1 || e.altKey) {
      isDragging = true;
      dragStartX = e.clientX; dragStartY = e.clientY;
      dragStartOX = offsetX; dragStartOY = offsetY;
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove', e => {
    if (isDragging) {
      offsetX = dragStartOX + (e.clientX - dragStartX);
      offsetY = dragStartOY + (e.clientY - dragStartY);
      applyTransform();
    }
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  document.getElementById('zoomIn').addEventListener('click', () => {
    scale = Math.min(50, scale * 1.5); applyTransform();
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    scale = Math.max(0.1, scale / 1.5); applyTransform();
  });
  document.getElementById('zoomReset').addEventListener('click', () => {
    scale = 1.0; offsetX = 0; offsetY = 0; applyTransform();
  });

  applyTransform();

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / scale);
    const y = Math.floor((e.clientY - rect.top) / scale);
    if (x >= 0 && x < width && y >= 0 && y < height) {
      const idx = y * width + x;
      const vals = Array.from({length: numChannels}, (_, c) => rasters[c][idx].toFixed(1));
      document.getElementById('info').textContent =
        `x: ${x}  y: ${y}  ${numChannels > 1 ? vals.map((v,i)=>`ch${i+1}:${v}`).join('  ') : 'value: ' + vals[0]}`;
    }
  });

  await loadPage(0);
})();
</script>
</body>
</html>
